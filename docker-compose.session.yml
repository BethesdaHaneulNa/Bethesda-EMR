# Isolated stack for a development session.
#
# docker-compose.yml fixes the container names and port 9080, and its top-level
# `name:` is bethesda-emr. Run it unchanged from a session worktree and Compose
# treats it as the SAME project as the clinic's running EMR: it rebuilds those
# containers from the worktree's code. This file gives each session its own
# containers, its own database volume and its own port instead.
#
#   SESSION=reception SESSION_PORT=9181 \
#     docker compose -p bethesda-s-reception \
#       -f docker-compose.yml -f docker-compose.session.yml up -d --build
#
# -p is what separates the project (and so the pgdata volume); SESSION only names
# the containers and images. Ports and names per session: wiki/01-working-rules.md.
#
# The base file also fixes the image tags (bethesda-emr-backend:latest, ...) so an
# offline clinic can load them without building. Left alone, a session's --build
# re-tags the clinic's images with unmerged session code, and the next plain
# `docker compose up -d` on the clinic's stack quietly runs it. Each session
# builds under its own tag instead.

services:
  db:
    container_name: bethesda-s-${SESSION:?set SESSION, e.g. reception}-db
  backend:
    container_name: bethesda-s-${SESSION}-api
    image: bethesda-s-${SESSION}-backend:dev
  frontend:
    container_name: bethesda-s-${SESSION}-web
    image: bethesda-s-${SESSION}-frontend:dev
    # !override replaces the base file's "9080:80" instead of adding to it -
    # otherwise the session would still try to take 9080.
    ports: !override
      - "127.0.0.1:${SESSION_PORT:?set SESSION_PORT, e.g. 9181}:80"
