server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page itself is always checked with the server before it is reused. With no
    # Cache-Control a browser decides for itself how long to keep index.html - days, for a
    # file that has not changed in weeks - and after an update staff went on getting the
    # old page, which names script files the new version no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Script and style files carry a hash of their content in their name: a changed file
    # is a new name, so these can be kept for good. A name that no longer exists must be
    # a 404 - falling back to index.html here handed the browser a page where it asked
    # for a script, and the screen stayed blank without a word.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # When the backend container is gone, nginx may still hold its old address and
        # wait the default 60 s to connect. Staff pressing Save should hear "server
        # unreachable" in seconds, not a minute. Only the connect is shortened - a slow
        # query still has the normal read timeout.
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /api_backend_down.json;
    }

    # Images put under another order (backend routes/pacs.move.js): the image server makes
    # the corrected study before this answers, and a study of many large images takes more
    # than the 60 s a request may wait by default (48 films: 68 s, measured). The correction
    # finished anyway, but the screen was told "not reachable". Only the waiting is longer.
    location = /api/pacs/move {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /api_backend_down.json;
    }

    # Outside images brought in (backend routes/pacs.import.js): one DICOM file a request,
    # often larger than the 1 MB a request may carry by default. It is handed on to the
    # backend as it comes - not kept on this server's disk first - and the backend checks
    # its size (the limit for one file is a setting). A large file from a CD takes minutes.
    location /api/pacs/import/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_body_timeout 900s;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /api_backend_down.json;
    }

    location = /api_backend_down.json {
        internal;
        default_type application/json;
        return 502 '{"error":"API backend is not reachable. Check Docker container bethesda-emr-api logs."}';
    }
}
