<!doctype html>
<meta charset="utf-8">
<title>Bethesda icons - EMR shapes</title>
<!-- One sheet: the EMR shapes to choose from (option C), each beside the PACS and CD icons,
     as three shortcuts would stand on a desktop. Posts a PNG to sheet-server.mjs.
     Generated into sheet2.html by icons.mjs. Design session tooling. -->
<body style="margin:0;background:#888">
<script>
/*DATA*/
(async function () {
  var keys = Object.keys(ALT), W = 1840, ROW = 300, TOP = 96, H = TOP + ROW * keys.length + 16;
  var FONT = '"Malgun Gothic","Segoe UI",system-ui,sans-serif';
  function img(svg) { return new Promise(function (res, rej) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = rej; i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }); }
  function wallpaper(ctx, x, y, w, h) {
    var g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#0b4f8a'); g.addColorStop(0.55, '#1b7fa8'); g.addColorStop(1, '#3fa58c'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  }
  var c = document.createElement('canvas'); c.width = W; c.height = H; var ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#111827'; ctx.font = '700 34px ' + FONT; ctx.fillText('안 C — EMR 그림 고르기', 28, 46);
  ctx.fillStyle = '#4b5563'; ctx.font = '400 20px ' + FONT; ctx.fillText('PACS(화면) · CD(디스크)는 그대로. EMR 만 종이 대신 넷 가운데 하나로. 오른쪽은 바탕화면에 셋이 나란히 놓인 모습(48 크기)과 가장 작은 크기(16).', 28, 78);
  var pacs = await img(PACS), cd = await img(CD);
  var names = ['가', '나', '다', '라'];
  for (var r = 0; r < keys.length; r++) {
    var k = keys[r], y = TOP + r * ROW, im = await img(ALT[k]);
    ctx.fillStyle = '#f3f4f6'; ctx.fillRect(0, y, 900, ROW - 12);
    ctx.fillStyle = '#111827'; ctx.font = '700 26px ' + FONT; ctx.fillText(names[r] + '. ' + ALTMETA[k].name, 290, y + 60);
    ctx.fillStyle = '#4b5563'; ctx.font = '400 18px ' + FONT; ctx.fillText(ALTMETA[k].note, 290, y + 92);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(im, 28, y + 16, 240, 240);
    var sx = 290; [48, 32, 16].forEach(function (s) { ctx.drawImage(im, sx, y + 256 - s - 16, s, s); sx += s + 22; });
    var small = document.createElement('canvas'); small.width = 16; small.height = 16; var sc = small.getContext('2d'); sc.imageSmoothingQuality = 'high'; sc.drawImage(im, 0, 0, 16, 16);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(small, sx + 10, y + 256 - 96 - 16, 96, 96); ctx.imageSmoothingEnabled = true;
    // the three shortcuts side by side: on a dark and on a desktop-like background
    var panels = [[912, '#111827', '#e5e7eb'], [1380, null, '#ffffff']];
    for (var p = 0; p < panels.length; p++) {
      var px = panels[p][0], pw = 456;
      if (panels[p][1]) { ctx.fillStyle = panels[p][1]; ctx.fillRect(px, y, pw, ROW - 12); } else wallpaper(ctx, px, y, pw, ROW - 12);
      var trio = [[im, 'Bethesda EMR'], [pacs, 'Bethesda PACS'], [cd, 'Bethesda CD']];
      for (var t = 0; t < 3; t++) {
        var tx = px + 40 + t * 136;
        ctx.drawImage(trio[t][0], tx + 24, y + 44, 64, 64);
        ctx.font = '500 14px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = panels[p][2];
        if (!panels[p][1]) { ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1; }
        ctx.fillText(trio[t][1], tx + 56, y + 132);
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.textAlign = 'left';
        // and at 16, as in a taskbar or a browser tab, enlarged four times
        var s16 = document.createElement('canvas'); s16.width = 16; s16.height = 16; var c16 = s16.getContext('2d'); c16.imageSmoothingQuality = 'high'; c16.drawImage(trio[t][0], 0, 0, 16, 16);
        ctx.drawImage(trio[t][0], tx + 12, y + 190, 16, 16);
        ctx.imageSmoothingEnabled = false; ctx.drawImage(s16, tx + 40, y + 166, 64, 64); ctx.imageSmoothingEnabled = true;
      }
    }
  }
  document.body.appendChild(c); c.style.cssText = 'display:block;max-width:100%;margin:0 auto';
  var blob = await new Promise(function (res) { c.toBlob(res, 'image/png'); });
  var resp = await fetch('/png?name=bethesda-icon-emr-shapes', { method: 'POST', body: blob });
  window.__sheets = resp.status + ':' + blob.size; document.title = 'done ' + window.__sheets;
})();
</script>
</body>
