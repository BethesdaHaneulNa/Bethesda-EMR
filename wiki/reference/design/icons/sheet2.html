 rx=\"5\" fill=\"#1d4ed8\"/></svg>","person":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" width=\"256\" height=\"256\"><defs><linearGradient id=\"gEperson\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3b82f6\"/><stop offset=\"1\" stop-color=\"#1d4ed8\"/></linearGradient></defs><rect x=\"16\" y=\"16\" width=\"224\" height=\"224\" rx=\"52\" fill=\"url(#gEperson)\"/><circle cx=\"128\" cy=\"90\" r=\"34\" fill=\"#fff\"/><path fill=\"#fff\" d=\"M56 212A72 72 0 0 1 200 212Z\"/><rect x=\"108\" y=\"171\" width=\"40\" height=\"14\" rx=\"3.5\" fill=\"#1d4ed8\"/><rect x=\"121\" y=\"158\" width=\"14\" height=\"40\" rx=\"3.5\" fill=\"#1d4ed8\"/></svg>"}; var ALTMETA = {"house":{"name":"집 (병원)","note":"베데스다 = 「자비의 집」. 지붕이 있는 집 안에 십자"},"heart":{"name":"하트","note":"돌봄. 하트 안에 십자"},"folder":{"name":"차트 폴더","note":"환자 차트를 넣는 폴더. 종이 대신 폴더"},"person":{"name":"사람 (환자)","note":"환자 한 사람. 가슴에 작은 십자"}}; var PACS = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" width=\"256\" height=\"256\"><defs><linearGradient id=\"gCpacs\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#8b5cf6\"/><stop offset=\"1\" stop-color=\"#5b21b6\"/></linearGradient></defs><rect x=\"16\" y=\"16\" width=\"224\" height=\"224\" rx=\"52\" fill=\"url(#gCpacs)\"/><rect x=\"40\" y=\"56\" width=\"176\" height=\"122\" rx=\"16\" fill=\"#fff\"/><rect x=\"112\" y=\"176\" width=\"32\" height=\"20\" fill=\"#fff\"/><rect x=\"84\" y=\"192\" width=\"88\" height=\"16\" rx=\"8\" fill=\"#fff\"/><rect x=\"93\" y=\"106\" width=\"70\" height=\"22\" rx=\"5.5\" fill=\"#5b21b6\"/><rect x=\"117\" y=\"82\" width=\"22\" height=\"70\" rx=\"5.5\" fill=\"#5b21b6\"/></svg>"; var CD = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\" width=\"256\" height=\"256\"><defs><linearGradient id=\"gCcd\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#1596b3\"/><stop offset=\"1\" stop-color=\"#155e75\"/></linearGradient></defs><rect x=\"
